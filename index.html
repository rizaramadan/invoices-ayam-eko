<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayam Eko — Invoices</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.5;
        }
        .header {
            background: #b71c1c;
            color: white;
            padding: 24px 16px;
            text-align: center;
        }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        .batch-list { list-style: none; }
        .batch-list li {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-bottom: 12px;
        }
        .batch-list a {
            display: block;
            padding: 16px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }
        .batch-list a:hover { background: #fce4ec; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Ayam Eko</h1>
        <p>Daftar Invoice per Batch</p>
    </div>
    <div class="container">
        <ul class="batch-list">
            <li><a href="./april-2026/">April 2026</a></li>
            <li><a href="./feb-2026/">Februari 2026</a></li>
        </ul>
    </div>
</body>
</html>
